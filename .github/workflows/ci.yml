name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ github.event.repository.private && github.event_name == 'push' && vars.TGTIME_WSL_CI == '1' && 'tgtime-wsl' || 'ubuntu-22.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: ${{ runner.environment == 'github-hosted' }}
        run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: ${{ runner.environment == 'github-hosted' }}
        run: |
          context="$(mktemp -d)"
          cp target/release/tgtime Dockerfile "$context/"
          docker build -t tgtime-rust:ci "$context"
          docker run --rm tgtime-rust:ci --help
